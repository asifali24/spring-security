spring:
  application:
    name: learnSpringSecurity
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/spring
    username: ${userName:}
    password: ${pass:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${redisHost:localhost}
      port: ${redisPort:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 5s
      timeout: 5s


  cache:
    type: redis

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${googleClientId:""}
            client-secret: ${googleSecret:""}
            scope: openid, profile, email


Jwt:
  key: ${JwtSecretKey:""}
