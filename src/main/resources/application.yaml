spring:
  application:
    name: learnSpringSecurity
  config:
    import: optional:file:.env[.properties]

#  security:
#    user:
#      name: admin
#      password: admin@123
#      roles:
#        - USER

  datasource:
    url: jdbc:postgresql://localhost:5432/spring
    username: ${userName:}
    password: ${pass:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
   oauth2:
    client:
      registration:
       google:
       client-id: ${googleClientId:}
       client-secret: ${googleSecret:}


Jwt:
  key: ${JwtSecretKey:}
